spring.application.name=parente

# --- Base H2 sur fichier (dev) ---
spring.datasource.url=jdbc:h2:file:./data/parente
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# Valeur par defaut rendue explicite (supprime l'avertissement open-in-view au demarrage)
spring.jpa.open-in-view=true

# --- Erreurs : inclure le message dans le corps JSON ---
# Spring Boot 4 : server.error.* est remplace par spring.web.error.* (l'ancienne cle est ignoree).
spring.web.error.include-message=always

# --- JSON (Jackson 3, Spring Boot 4) : snake_case, dates ISO yyyy-MM-dd ---
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
# Parametres de requete / formulaires de type LocalDate au format ISO (yyyy-MM-dd)
spring.mvc.format.date=iso
