# Profil "test" : complete application.properties de src/main (sans le masquer).
# Base H2 en memoire, schema recree a chaque contexte ; chaque test est annule (rollback).
spring.datasource.url=jdbc:h2:mem:parente;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop

# Date de reference figee ("aujourd'hui") pour l'age, la regle d'age et la validation des dates.
app.date-reference=2026-11-18
